aid: elementum
name: Elementum
description: >-
  Elementum is an AI-native process automation and orchestration platform that lets enterprises
  build custom business workflows that coordinate people, rules, LLMs, and AI agents without moving
  data out of the customer's own data warehouse (its "Zero Persistence" / CloudLink model, with
  first-class Snowflake integration). Originally a multi-enterprise supply chain orchestration
  vendor, Elementum pivoted to general enterprise AI orchestration spanning supply chain, finance,
  healthcare, and compliance. It exposes a versioned REST API (v1, US and EU regions) secured with
  OAuth 2.0 client-credentials for records, apps, elements, tasks, attachments, comments, watchers,
  related items, agents, automations, flows, skills, tables, views, groups, and users, plus a public
  documentation MCP server, SAML SSO/SCIM provisioning, and service accounts for agents and
  automations. Elementum is backed by Lightspeed Venture Partners, Snowflake Ventures, and others.
