openapi: 3.2.0
info:
  title: Elementum Apps API
  description: Compose and manage apps
  contact:
    email: apiteam@elementum.io
  version: 0.0.1
servers:
- url: /v1
tags:
- name: Apps
  description: Compose and manage apps
paths:
  /aspects/compose:
    post:
      tags:
      - Apps
      summary: Create or update an app (compose)
      operationId: composeApp
      parameters: []
      requestBody:
        description: Free-form JSON payload forwarded to the downstream service
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughObject'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughObject'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - ClientCredentials: []
      x-codegen-request-body-name: body
  /aspects/compose/{id}:
    put:
      tags:
      - Apps
      summary: Update an app by ID
      operationId: updateApp
      parameters:
      - $ref: '#/components/parameters/passthroughId'
      requestBody:
        description: Free-form JSON payload forwarded to the downstream service
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughObject'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughObject'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - ClientCredentials: []
      x-codegen-request-body-name: body
components:
  responses:
    '429':
      description: Too Many Requests
    '404':
      description: Not Found
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '400':
      description: Bad Request
    '422':
      description: Unprocessable Entity
    '500':
      description: Internal Server Error
  parameters:
    passthroughId:
      name: id
      in: path
      description: The resource ID
      required: true
      schema:
        type: string
        format: string
  schemas:
    PassthroughObject:
      type: object
      additionalProperties: true
      description: Free-form JSON object forwarded to/from the downstream service.
  securitySchemes:
    ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
externalDocs:
  description: Find out more about Elementum
  url: https://www.elementum.com/
