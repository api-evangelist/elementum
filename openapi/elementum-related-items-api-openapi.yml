openapi: 3.2.0
info:
  title: Elementum Related Items API
  description: Manage the related items of a record
  contact:
    email: apiteam@elementum.io
  version: 0.0.1
servers:
- url: /v1
tags:
- name: Related Items
  description: Manage the related items of a record
paths:
  /{recordType}/{alias}/{id}/related-items:
    get:
      tags:
      - Related Items
      summary: Get the list of related items
      operationId: getRecordRelations
      parameters:
      - $ref: '#/components/parameters/recordType'
      - $ref: '#/components/parameters/alias'
      - $ref: '#/components/parameters/recordId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedPagedList'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - ClientCredentials: []
      x-codegen-request-body-name: body
    post:
      tags:
      - Related Items
      summary: Add a related item
      operationId: createRecordRelatedItems
      parameters:
      - $ref: '#/components/parameters/recordType'
      - $ref: '#/components/parameters/alias'
      - $ref: '#/components/parameters/recordId'
      requestBody:
        description: the id and alias of the item to be related to this one
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelatedItemInput'
        required: true
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - ClientCredentials: []
      x-codegen-request-body-name: body
  /{recordType}/{alias}/{id}/related-items/{itemId}:
    delete:
      tags:
      - Related Items
      summary: Remove a related item
      operationId: deleteRecordRelatedItems
      parameters:
      - $ref: '#/components/parameters/recordType'
      - $ref: '#/components/parameters/alias'
      - $ref: '#/components/parameters/recordId'
      - $ref: '#/components/parameters/itemId'
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security:
      - ClientCredentials: []
      x-codegen-request-body-name: body
components:
  responses:
    '422':
      description: Unprocessable Entity
    '500':
      description: Internal Server Error
    '403':
      description: Forbidden
    '400':
      description: Bad Request
    '429':
      description: Too Many Requests
    '401':
      description: Unauthorized
    '404':
      description: Not Found
  schemas:
    RelatedListItem:
      type: object
      properties:
        cursor:
          type: string
        alias:
          type: string
        type:
          type: string
        id:
          type: string
    RelatedPagedList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RelatedListItem'
        total:
          type: integer
          format: int32
        paging:
          $ref: '#/components/schemas/PagingState'
      example:
        items:
        - cursor: Ijf7eqZc0RlZmluaXRpb25zfDA=
          alias: tasks
          type: TASK
          id: TSK-4
        - cursor: cHJvY2Vzc0RlZmluaXRpb25zfDA=
          alias: itmanagement
          type: APP
          id: ITM-4
        total: 2
        paging:
          has_next_page: false
          end_cursor: cHJvY2Vzc0RlZmluaXRpb25zfDA=
          start_cursor: Ijf7eqZc0RlZmluaXRpb25zfDA=
          has_previous_page: false
    RelatedItemInput:
      required:
      - id
      type: object
      properties:
        id:
          type: string
        alias:
          type: string
      example:
        id: ITM-4
        alias: itmanagement
    PagingState:
      type: object
      properties:
        has_next_page:
          type: boolean
        end_cursor:
          type: string
        start_cursor:
          type: string
        has_previous_page:
          type: boolean
  parameters:
    itemId:
      name: itemId
      in: path
      description: The ID of the related item
      required: true
      schema:
        type: string
        format: string
    recordType:
      name: recordType
      in: path
      description: '''apps'', ''elements'', ''tasks'', or ''transactions'''
      required: true
      schema:
        type: string
        format: string
    alias:
      name: alias
      in: path
      description: The app's namespace or its UUID
      required: true
      schema:
        type: string
        format: string
    recordId:
      name: id
      in: path
      description: The record ID
      required: true
      schema:
        type: string
        format: string
  securitySchemes:
    ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
externalDocs:
  description: Find out more about Elementum
  url: https://www.elementum.com/
x-provenance:
  method: harvested
  publisher: Elementum
  source: https://api.elementum.io/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
