envelope: >-
  Elementum uses standard HTTP status codes to signal success or failure. Error responses in the
  OpenAPI carry a description only (no application/problem+json body schema is declared), so this
  catalog is the documented status-code registry rather than an RFC 9457 problem-type set.
problems:
